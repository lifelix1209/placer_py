[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placer-te"
version = "1.0.0.dev0"
description = "Python port of the PLACER pipeline: BAM to TE insertion calls"
readme = "README.md"
# 3.9 works and is what the suite is run on: every module uses
# `from __future__ import annotations`, so the `X | Y` syntax throughout is
# never evaluated at runtime.
requires-python = ">=3.9"
keywords = ["transposable-element", "long-read", "structural-variant", "bioinformatics"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Empty, and that is the point: nothing in the decision layer imports a third-
# party package. `numpy` was declared here and imported nowhere -- removing it
# is what makes the `no-dependencies` CI job's claim true end to end.
dependencies = []

[project.urls]
Homepage = "https://github.com/lifelix1209/placer-py"
Changelog = "https://github.com/lifelix1209/placer-py/blob/main/CHANGELOG.md"
"Reference implementation" = "https://github.com/lifelix1209/PLACER"

[project.scripts]
placer = "placer.main:main"

[project.optional-dependencies]
# The decision layer needs nothing at all: `placer.finalization` and
# everything it imports run on a ledger alone, which is why these are optional
# rather than required.
#
#   pysam      reading the BAM and the indexed reference
#   pyabpoa    the event consensus -- see placer/consensus.py for why there
#              is no pure-Python fallback
#   rapidfuzz  the flank-placement edit distance, which was ~60% of a real run
#              in pure Python. OPTIONAL even here: `core/breakpoints.py` falls
#              back to the pure-Python DP, which gives the same answer, so
#              the decision layer still needs nothing installed.
#
# BLAST+ (blastn, makeblastdb) is also needed for the TE alignment, and is not
# a Python package: it has to be on PATH, or `te_blastn_path` set.
scan = ["pysam>=0.22", "pyabpoa>=1.4", "rapidfuzz>=3.0"]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.5"]

[tool.setuptools.packages.find]
include = ["placer*"]

# `py.typed` has to be listed or it is not in the wheel, and a marker that
# ships only in the source tree marks nothing: without it in the installed
# package, a downstream mypy or pyright treats every `placer` import as
# `Any` and none of the annotations below are visible to anyone but us.
[tool.setuptools.package-data]
placer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports `placer` and the tests import each other's helpers via
# conftest, so both the root and tests/ have to be importable.
pythonpath = [".", "tests"]
# -r s prints the skip reasons, which is how any remaining migration surface is
# read off the suite: every skip is one unported function.
# --import-mode=importlib: when there were two conftest.py files, the default
# "prepend" mode registered both as `conftest` and the second shadowed the
# first. There is one now, but the tests still do `from conftest import ...`,
# and importlib mode keeps that unambiguous if a second ever appears.
#
# --strict-config turns an unknown ini key into an error. Without it a typo'd
# option is a warning that scrolls past, which is exactly how the line above
# was first written wrong (as a bare `importmode =` key) and silently ignored.
addopts = "-q -r s --strict-markers --strict-config --import-mode=importlib"
markers = [
    "invariant: asserts a mathematical property that any implementation must satisfy",
    "regression: pins a bug that was found and fixed, so it cannot come back",
    "contract: pins the ledger schema, i.e. the seam between the two languages",
]

[tool.mypy]
# 3.9 is the floor `requires-python` promises, so that is what the annotations
# are checked against -- a 3.10-only stdlib signature would otherwise pass here
# and fail for a user on the version this package claims to support.
python_version = "3.9"
files = ["placer"]

# What is ON is the set that was already clean, or was made clean in the commit
# that adopted mypy: the gate starts green, so any finding is new. The first
# run found 44, of which the ones worth naming were two annotations that lied
# about None (`bam_io`'s handles, which `close()` sets to None, and
# `csv.DictReader` columns that can be missing), one variable holding two
# different record types in one function, twice, and five attribute reads on a
# value typed `object`.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_no_return = true
strict_equality = true

# DELIBERATELY OFF:
#
#   disallow_untyped_defs  61 findings. Annotation coverage is ~94% and the
#                          gaps cluster in one place -- 21 of them in
#                          `policy.py`, all from the same `te_alignment`
#                          parameter left unannotated to avoid a circular
#                          import. A Protocol fixes that cluster; until then
#                          this flag is 61 lines of noise hiding one cause.
#   no_implicit_reexport   22 findings, all of them the re-exports this
#                          codebase makes on purpose -- `alignment.py` re-
#                          exports the CIGAR and flag constants from `reads.py`
#                          so there is one definition of each, and says so at
#                          the import.

[[tool.mypy.overrides]]
# No stubs and no py.typed, and it is an optional dependency: `consensus.py`
# imports it lazily precisely so the decision layer does not need it. Note the
# error only appears on a COLD cache, which is what CI always has.
module = ["pyabpoa"]
ignore_missing_imports = true

[tool.ruff]
# 100, not 88. The codebase is hand-wrapped to ~79 (p95 of every line in the
# repository is 80 columns) and the prose in the module docstrings is a large
# part of what makes it readable. A limit at 88 would flag 420 lines and
# invite reflowing paragraphs that are deliberately shaped; 100 flags only the
# genuinely long ones while still stopping new code from drifting wider.
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "examples/data"]

[tool.ruff.lint]
# Chosen for defect-finding, not for style enforcement. `F` is the one that
# pays for itself here -- it found 19 unused imports and 4 unused variables in
# a codebase with no linter. `B` catches real bugs (mutable defaults, loop
# variable capture); `UP` keeps the 3.9-compatible `from __future__ import
# annotations` idiom consistent; `I` stops import blocks drifting.
#
# Deliberately NOT enabled: `D` (docstring style) would fight the existing
# prose convention, and `ANN` (annotation completeness) is noise until the
# modules that are about to be deleted are gone.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PIE", "PERF"]
ignore = [
    # `dict(a=1)` reads better than `{"a": 1}` where the keys are identifiers,
    # and the codebase uses it consistently for config-shaped literals.
    "C408",
    # Guard clauses in this codebase are often nested to mirror the C++ they
    # were ported from, with a comment per level explaining the condition.
    # Collapsing them would merge the comments.
    "SIM102",
    # E501 finds no defects, and enabling it here would contradict the
    # paragraph above. `line-length` is still set, so `ruff format` and any
    # editor reading this file agree on the target; what is not wanted is 80
    # existing lines flagged forever.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests name short throwaway variables and build long literal tables.
"tests/*" = ["E741"]
