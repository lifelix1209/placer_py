name: tests

on:
  push:
  pull_request:

jobs:
  # The suite has NO third-party dependency -- not even pytest. Running it with
  # a bare interpreter is what proves that, and it is the reason the repository
  # carries `tools/run_tests_without_pytest.py` at all: a green run here means
  # the decision layer can be audited in a locked-down environment with no
  # package index.
  no-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite with no packages installed
        run: python3 tools/run_tests_without_pytest.py

  # The same suite under pytest, which is what a contributor runs locally. Both
  # jobs must pass: the runner implements only the pytest surface the suite
  # uses, so a divergence between them means the runner needs extending.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
